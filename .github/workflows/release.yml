name: Release

# Push a tag like v0.2.0 to build installers and attach them to a draft
# GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Claude Local v__VERSION__
          releaseBody: |
            **macOS:** download the `.dmg` (Apple Silicon and Intel). The app is not notarized yet, so on first launch right-click it in Applications and choose **Open**.
            **Windows:** download the `-setup.exe` (or the `.msi`).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
