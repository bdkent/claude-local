name: Release

# Builds the macOS and Windows installers and attaches them to a draft
# GitHub Release; review the draft, then publish it. Start it either by
# pushing a tag like v0.2.0, or from the Actions tab with "Run workflow",
# which tags the current commit with the version from package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Claude Local v__VERSION__
          releaseBody: |
            **macOS:** download the `.dmg` (Apple Silicon and Intel) and drag Claude Local to Applications. It isn't notarized yet, so macOS blocks the first launch. Fix it once with `xattr -dr com.apple.quarantine "/Applications/Claude Local.app"`, or open the app, click **Done**, then System Settings → Privacy & Security → **Open Anyway**.
            **Windows:** download the `-setup.exe` (or the `.msi`).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
