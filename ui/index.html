<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Sessions</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="list-view">
      <header class="toolbar">
        <div class="segmented" role="tablist" aria-label="Session kind">
          <button data-kind="all" class="active">All</button>
          <button data-kind="background">Bg</button>
          <button data-kind="interactive">Interactive</button>
        </div>
        <button id="new-session-button" class="icon" title="New session" aria-label="New session">＋</button>
        <button id="refresh" class="icon" title="Refresh" aria-label="Refresh">↻</button>
        <button id="open-settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
      </header>
      <div class="filters">
        <select id="project" aria-label="Project"></select>
        <input id="search" type="search" placeholder="Filter by name" aria-label="Filter by name" />
      </div>
      <section id="setup" class="setup" hidden></section>
      <div id="banner" class="banner" hidden></div>
      <ul id="groups" class="groups"></ul>
      <p id="empty" class="empty" hidden></p>
      <footer id="status" class="status"></footer>
    </main>

    <main id="settings-view" hidden>
      <header class="toolbar">
        <h1>Settings</h1>
      </header>
      <form id="settings" class="settings">
        <label>
          Open sessions in
          <select name="terminal"></select>
        </label>
        <label id="custom-row">
          Custom command
          <input name="customTerminal" placeholder="my-term --cwd {cwd} -e {args}" spellcheck="false" />
          <small>Placeholders: {args} (the claude command), {cwd}, {name}, {command} (a full shell line)</small>
        </label>
        <label class="check">
          <input type="checkbox" name="keepalive" />
          Keep background sessions alive
        </label>
        <small class="hint">Holds a hidden <code>claude attach</code> on each background session so it never idles out.</small>
        <label class="check">
          <input type="checkbox" name="newSessionBackground" />
          Start new sessions in the background
        </label>
        <label class="check">
          <input type="checkbox" name="autostart" />
          Launch at login
        </label>
        <label>
          <span>Path to <code>claude</code></span>
          <input name="claudePath" placeholder="Search PATH" spellcheck="false" />
          <small id="claude-resolved"></small>
        </label>
        <p id="settings-error" class="banner error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel-settings">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
        <small id="config-path" class="hint"></small>
      </form>
    </main>

    <dialog id="new-session">
      <form id="new-session-form">
        <h2>New session</h2>
        <label>
          Project folder
          <span class="row">
            <select name="cwd" required></select>
            <button type="button" id="choose-folder">Choose…</button>
          </span>
          <small id="cwd-path"></small>
        </label>
        <label>
          Name
          <input name="name" placeholder="e.g. fix-save-bug" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          First prompt
          <textarea name="prompt" rows="5" placeholder="What should Claude work on?"></textarea>
        </label>
        <label class="check">
          <input type="checkbox" name="background" />
          Start in background
        </label>
        <p id="new-session-error" class="banner error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel-new-session">Cancel</button>
          <button type="submit" class="primary">Start</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
