<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Sessions</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="list-view">
      <div class="controls">
        <header class="toolbar">
          <div class="segmented" role="group" aria-label="Listing">
            <button id="show-all" aria-pressed="true" data-tip="On: everything claude agents --json --all lists. Off: only claude agents --json.">All</button>
          </div>
          <div class="segmented grow" role="group" aria-label="Session kinds">
            <button data-kind="background" aria-pressed="true" data-tip="Show background sessions (started with claude --bg)">Bg</button>
            <button data-kind="interactive" aria-pressed="true" data-tip="Show interactive sessions">Interactive</button>
          </div>
          <button id="new-session-button" class="icon" data-tip="Start a new session in a project folder" aria-label="New session">＋</button>
          <button id="refresh" class="icon" data-tip="Refresh the list now" aria-label="Refresh">↻</button>
          <button id="open-settings" class="icon" data-tip="Settings" aria-label="Settings">⚙</button>
        </header>
        <div class="filters">
          <select id="project" aria-label="Project" data-tip="Show sessions from one project folder"></select>
          <input id="search" type="search" placeholder="Filter by name" aria-label="Filter by name" data-tip="Filter by session or project name" />
        </div>
        <div class="filters states" role="group" aria-label="States">
          <button data-state="working" aria-pressed="true" data-tip="Show sessions whose state is working"><span class="dot green"></span>working</button>
          <button data-state="blocked" aria-pressed="true" data-tip="Show sessions whose state is blocked"><span class="dot orange"></span>blocked</button>
          <button data-state="done" aria-pressed="true" data-tip="Show sessions whose state is done"><span class="dot blue"></span>done</button>
          <button data-state="other" aria-pressed="true" data-tip="Show sessions with no state, or any other state"><span class="dot gray"></span>other</button>
        </div>
        <div class="filters">
          <select id="group-by" aria-label="Group by" data-tip="How sessions are grouped">
            <option value="project">Group: Project</option>
            <option value="state">Group: State</option>
            <option value="none">Group: None</option>
          </select>
          <select id="sort-by" aria-label="Sort by" data-tip="How sessions are ordered within each group: by name (A–Z) or by startedAt (newest first)">
            <option value="name">Sort: Name</option>
            <option value="started">Sort: Started</option>
          </select>
        </div>
      </div>
      <section id="setup" class="setup" hidden></section>
      <div id="banner" class="banner" hidden></div>
      <div id="groups" class="groups"></div>
      <p id="empty" class="empty" hidden></p>
      <footer id="status" class="status" data-tip="When the list last refreshed, and how many background sessions are being kept alive"></footer>
    </main>

    <main id="settings-view" hidden>
      <header class="toolbar">
        <h1>Settings</h1>
      </header>
      <form id="settings" class="settings">
        <label>
          Open sessions in
          <select name="terminal" data-tip="The terminal app used to open a session or start an interactive one. Only installed terminals are listed."></select>
        </label>
        <label id="custom-row">
          Custom command
          <input name="customTerminal" placeholder="my-term --cwd {cwd} -e {args}" spellcheck="false" data-tip="A command that opens a terminal. {args} becomes the claude command, {cwd} the project folder, {name} the session name, {command} a full shell line." />
          <small>Placeholders: {args} (the claude command), {cwd}, {name}, {command} (a full shell line)</small>
        </label>
        <label class="check" data-tip="Claude Code idles a background session after 8 hours with nothing attached. This keeps a hidden client attached to each one (shown by the link icon).">
          <input type="checkbox" name="keepalive" />
          Keep background sessions alive
        </label>
        <small class="hint">Holds a hidden <code>claude attach</code> on each background session so it never idles out.</small>
        <label class="check" data-tip="Default for the “Start in background” box in the New session dialog">
          <input type="checkbox" name="newSessionBackground" />
          Start new sessions in the background
        </label>
        <label class="check" data-tip="Start Claude Local when you log in, so background sessions are always kept alive">
          <input type="checkbox" name="autostart" />
          Launch at login
        </label>
        <label>
          <span>Path to <code>claude</code></span>
          <input name="claudePath" placeholder="Search PATH" spellcheck="false" data-tip="Leave empty to find claude on your PATH. Set it if claude is installed somewhere unusual." />
          <small id="claude-resolved"></small>
        </label>
        <p id="settings-error" class="banner error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel-settings">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
        <small id="config-path" class="hint"></small>
      </form>
    </main>

    <dialog id="confirm-delete">
      <form id="delete-form">
        <h2 id="delete-title"></h2>
        <p id="delete-body"></p>
        <small id="delete-where"></small>
        <pre id="delete-claude" hidden></pre>
        <p id="delete-error" class="banner error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel-delete">Cancel</button>
          <button type="submit" class="danger" id="confirm-delete-button" data-tip="Runs claude rm for this session">Delete</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
